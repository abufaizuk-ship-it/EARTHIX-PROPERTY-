name: Unzip project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip
        run: |
          mkdir /tmp/x
          unzip -q ./*.zip -d /tmp/x
          d=/tmp/x
          if [ "$(ls -A $d | wc -l)" -eq 1 ] && [ -d "$d/$(ls -A $d)" ]; then d="$d/$(ls -A $d)"; fi
          cp -a "$d"/. .
          rm -f ./*.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract project"
          git push
